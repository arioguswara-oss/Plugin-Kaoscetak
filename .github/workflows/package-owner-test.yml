name: Kaoscetak RC integration and QA package
on:
  push:
    branches: [develop/lite-designer-v1]
  pull_request:
    paths: ['plugins/kaoscetak-lite-designer/**', 'tests/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wordpress-woocommerce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA-only browser dependencies
        run: |
          npm ci --prefix tests
          python -m pip install playwright==1.55.0
      - name: Install actual built ZIP in disposable WordPress and WooCommerce 11.3
        run: KLD_ALLOW_LOCAL_FIXTURE=1 sh tests/setup.sh
      - name: PHP syntax, standalone regression and real WordPress REST/cart tests
        run: |
          docker compose -f tests/compose.yml exec -T wordpress sh -c 'set -e; find /fixtures/plugins /fixtures/tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l; cd /fixtures; for f in tests/test_*.php; do php "$f" || exit 1; done'
          docker compose -f tests/compose.yml exec -T wordpress php /fixtures/tests/.downloads/wp-cli.phar --allow-root eval-file /fixtures/tests/wordpress_regression.php > tests/results/wordpress-regression.json
          docker compose -f tests/compose.yml exec -T wordpress php /fixtures/tests/.downloads/wp-cli.phar --allow-root eval-file /fixtures/tests/variable_integration.php
          node --check plugins/kaoscetak-lite-designer/assets/editor.js
      - name: Real storefront browser flow and isolated editor regressions
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node tests/customer-flow.cjs
          python tests/test_editor_responsive.py
          python tests/test_editor_browser.py
          node tests/lifecycle.cjs
      - name: Verify deterministic package
        run: |
          cp dist/kaoscetak-lite-designer-0.3.2-rc.1.zip /tmp/kld-tested.zip
          python3 scripts/build.py
          cmp /tmp/kld-tested.zip dist/kaoscetak-lite-designer-0.3.2-rc.1.zip
          cd dist && sha256sum -c SHA256SUMS
      - name: Publish owner QA candidate only
        uses: actions/upload-artifact@v4
        with:
          name: Kaoscetak-Lite-Designer-0.3.2-rc.1-DRAFT-QA
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Collect local fixture diagnostics
        if: always()
        run: docker compose -f tests/compose.yml logs --no-color > tests/results/containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kaoscetak-local-test-evidence
          path: tests/results/
          retention-days: 14
      - name: Remove only disposable fixture
        if: always()
        run: docker compose -f tests/compose.yml down -v
