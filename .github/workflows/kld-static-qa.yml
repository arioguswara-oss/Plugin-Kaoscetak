name: Kaoscetak Lite Designer static QA
on:
  push:
    branches:
      - fix/kld-p0-cart-preview-20261118
  pull_request:
    paths:
      - 'plugins/kaoscetak-lite-designer/**'
      - '.github/workflows/kld-static-qa.yml'
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: PHP syntax checks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find plugins/kaoscetak-lite-designer -type f -name '*.php' -print0)
          if (( ${#files[@]} == 0 )); then echo 'No PHP files found'; exit 1; fi
          for file in "${files[@]}"; do php -l "$file"; done
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find plugins/kaoscetak-lite-designer -type f -name '*.js' -print0)
          if (( ${#files[@]} == 0 )); then echo 'No JS files found'; exit 1; fi
          for file in "${files[@]}"; do node --check "$file"; done
