<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANRO Studio — Pratinjau Editor Buyer</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2938;background:#eef2f6}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;background:white;border-radius:9px;padding:10px}button:focus-visible,input:focus-visible{outline:3px solid #60a5fa}.top{background:#12243c;color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.top small{display:block;color:#bcd0e5}.shell{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;max-width:1200px;margin:auto;padding:18px}.canvas{background:white;border-radius:14px;padding:16px;min-width:0}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button[aria-pressed=true]{background:#173d67;color:white}.shirt{width:min(100%,390px);height:440px;margin:auto;position:relative;display:grid;place-items:center;background:#e2e8f0;border-radius:18px;overflow:hidden}.shirt svg{position:absolute;inset:0;width:100%;height:100%}.safe{position:absolute;top:22%;left:28%;width:44%;height:52%;border:1.5px dashed #4f81aa;touch-action:none;overflow:hidden}.design-img{position:absolute;max-width:none;object-fit:contain;touch-action:none;user-select:none}.design-text{position:absolute;white-space:pre-wrap;overflow-wrap:anywhere;touch-action:none;user-select:none;line-height:1.15}.panel{background:white;border-radius:14px;padding:18px;display:grid;align-content:start;gap:12px}.panel label{display:grid;gap:5px;font-size:14px}.panel input,.panel textarea,.panel select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px}.panel input[type=color]{height:42px}.panel input[type=range]{padding:0}.row{display:flex;gap:8px}.row>*{flex:1}.muted{font-size:12px;color:#52657b}.notice{background:#fff6dc;padding:10px;border-radius:8px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.primary{background:#145d9b;color:white;border-color:#145d9b}.footer{font-size:12px;color:#64748b;margin-top:10px;text-align:center}@media(max-width:750px){.shell{display:flex;flex-direction:column;padding:8px;gap:8px}.canvas,.panel{border-radius:10px}.shirt{height:360px;width:min(100%,320px)}.top{padding:10px 14px}}
</style></head><body>
<header class="top"><div><strong>SANRO Studio</strong><small>Editor kaos — prototipe lokal</small></div><span>Pratinjau saja</span></header>
<main class="shell"><section class="canvas" aria-label="Pratinjau kaos"><div class="tabs"><button id="front" aria-pressed="true">Depan</button><button id="back" aria-pressed="false">Belakang</button></div>
<div class="shirt" id="shirt"><svg viewBox="0 0 390 440" aria-hidden="true"><path id="fabric" d="M120 35 150 18 Q195 58 240 18 L270 35 353 88 319 155 278 137 278 417 112 417 112 137 71 155 37 88Z" fill="#fff" stroke="#a5b4c4" stroke-width="3"/><path d="M150 18 Q195 86 240 18" fill="none" stroke="#a5b4c4" stroke-width="3"/></svg><div class="safe" id="safe"><img id="image" class="design-img" alt="Gambar desain" hidden><div id="text" class="design-text" hidden></div></div></div>
<div class="footer">Geser gambar atau teks di area putus-putus. Area hanya simulasi, bukan ukuran cetak aktual.</div></section>
<aside class="panel"><strong>Atur desain</strong><label>Warna kaos <input id="color" type="color" value="#ffffff"></label><label>Unggah gambar PNG/JPEG (maks. 10 MB) <input id="upload" type="file" accept="image/png,image/jpeg"></label><label>Ukuran gambar <input id="imageSize" type="range" min="10" max="100" value="65"></label><button id="removeImage">Hapus gambar sisi ini</button><label>Teks (satu blok per sisi) <textarea id="textInput" rows="3" maxlength="300" placeholder="Tulis teks desain"></textarea></label><div class="row"><label>Warna teks <input id="textColor" type="color" value="#111827"></label><label>Ukuran teks <input id="fontSize" type="range" min="10" max="48" value="22"></label></div><label>Kategori cetak <select id="category"><option>A5</option><option>A4</option><option>A3</option><option>A3+</option></select></label><div class="row"><label>Size <select id="size"><option>S</option><option selected>M</option><option>L</option><option>XL</option><option>2XL</option><option>3XL</option><option>4XL</option><option>5XL</option></select></label><label>Jumlah <input id="qty" type="number" min="1" max="1000" value="1"></label></div><div class="notice" id="status" role="status">File hanya dipratinjau di perangkat ini. Belum tersimpan ke server atau Google Drive.</div><div class="actions"><button id="reset">Reset sisi</button><button class="primary" id="save" disabled>Simpan desain (belum aktif)</button></div></aside></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const makeSide=()=>({url:null,objectUrl:null,text:'',imageX:15,imageY:15,imageSize:65,imageAspect:1,textX:10,textY:70,textColor:'#111827',fontSize:22,category:'A5'});
const sides={front:makeSide(),back:makeSide()};let active='front';const ids=['front','back'];
function status(message){$('status').textContent=message}
function render(){const d=sides[active];ids.forEach(k=>$(k).setAttribute('aria-pressed',String(k===active)));$('image').hidden=!d.url;if($('image').getAttribute('src')!==(d.url||''))$('image').src=d.url||'';$('image').style.cssText='left:'+d.imageX+'%;top:'+d.imageY+'%;width:'+d.imageSize+'%';$('text').hidden=!d.text;$('text').textContent=d.text;$('text').style.cssText='left:'+d.textX+'%;top:'+d.textY+'%;color:'+d.textColor+';font-size:'+d.fontSize+'px;max-width:90%';$('textInput').value=d.text;$('imageSize').value=d.imageSize;$('textColor').value=d.textColor;$('fontSize').value=d.fontSize;$('category').value=d.category}
ids.forEach(k=>$(k).addEventListener('click',()=>{active=k;render()}));
$('color').addEventListener('input',e=>$('fabric').setAttribute('fill',e.target.value));
$('textInput').addEventListener('input',e=>{sides[active].text=e.target.value;render()});
$('textColor').addEventListener('input',e=>{sides[active].textColor=e.target.value;render()});
$('fontSize').addEventListener('input',e=>{sides[active].fontSize=Number(e.target.value);render()});
$('imageSize').addEventListener('input',e=>{sides[active].imageSize=Number(e.target.value);render()});
$('category').addEventListener('change',e=>sides[active].category=e.target.value);
$('upload').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg'].includes(file.type)||file.size>10*1024*1024){status('File ditolak: gunakan PNG/JPEG maksimal 10 MB.');e.target.value='';return}const side=active;const d=sides[side];const nextUrl=URL.createObjectURL(file);const probe=new Image();probe.onload=()=>{if(sides[side]!==d){URL.revokeObjectURL(nextUrl);return}if(d.objectUrl)URL.revokeObjectURL(d.objectUrl);d.objectUrl=nextUrl;d.url=nextUrl;d.imageAspect=probe.naturalWidth/probe.naturalHeight;render();status('Pratinjau lokal berhasil. Master belum diunggah.')};probe.onerror=()=>{URL.revokeObjectURL(nextUrl);status('Gambar tidak dapat dibaca. File ditolak.')};probe.src=nextUrl;e.target.value=''});
$('removeImage').addEventListener('click',()=>{const d=sides[active];if(d.objectUrl)URL.revokeObjectURL(d.objectUrl);d.url=null;d.objectUrl=null;render()});
$('reset').addEventListener('click',()=>{const d=sides[active];if(d.objectUrl)URL.revokeObjectURL(d.objectUrl);sides[active]=makeSide();render()});
function drag(element,type){let start=null;element.addEventListener('pointerdown',e=>{if(element.hidden)return;start={x:e.clientX,y:e.clientY,side:active,px:type==='image'?sides[active].imageX:sides[active].textX,py:type==='image'?sides[active].imageY:sides[active].textY};element.setPointerCapture(e.pointerId)});element.addEventListener('pointermove',e=>{if(!start)return;const d=sides[start.side],rect=$('safe').getBoundingClientRect();const dx=(e.clientX-start.x)/rect.width*100,dy=(e.clientY-start.y)/rect.height*100;const maxX=type==='image'?100-d.imageSize:Math.max(0,100-element.offsetWidth/rect.width*100);const maxY=Math.max(0,100-element.offsetHeight/rect.height*100);d[type==='image'?'imageX':'textX']=Math.max(0,Math.min(maxX,start.px+dx));d[type==='image'?'imageY':'textY']=Math.max(0,Math.min(maxY,start.py+dy));render()});element.addEventListener('pointerup',()=>start=null);element.addEventListener('pointercancel',()=>start=null)}
drag($('image'),'image');drag($('text'),'text');render();
</script></body></html>
